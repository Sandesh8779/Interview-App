<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Store Demo</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: system-ui, Arial; padding: 2rem; }
      label { display:block; margin-top: .75rem; }
      textarea { width:100%; height:160px; }
      input, button { padding: .5rem; margin-top: .5rem; }
      pre { background:#f6f8fa; padding:1rem; border-radius:6px; }
    </style>
  </head>
  <body>
    <h1>Store Demo</h1>
    <p>Use this page to POST JSON to <code>/api/store</code> (backend must be running at <code>http://127.0.0.1:4000</code>).</p>

    <label>Table name
      <input id="table" placeholder="table_name" value="user_payloads" />
    </label>

    <label>JSON data
      <textarea id="data">{"example":true}</textarea>
    </label>

    <div>
      <button id="send">Send</button>
      <button id="clear">Clear</button>
    </div>

    <h3>Result</h3>
    <pre id="result">—</pre>

    <script>
      const api = (path) => `http://127.0.0.1:4000${path}`;
      document.getElementById('send').addEventListener('click', async () => {
        const table = document.getElementById('table').value.trim();
        const txt = document.getElementById('data').value.trim();
        let parsed;
        try {
          parsed = JSON.parse(txt);
        } catch (e) {
          document.getElementById('result').textContent = 'Invalid JSON: ' + e.message;
          return;
        }

        document.getElementById('result').textContent = 'Sending...';
        try {
          const resp = await fetch(api('/api/store'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ table, data: parsed })
          });
          const body = await resp.json();
          if (!resp.ok) throw new Error(body?.message || resp.statusText);
          document.getElementById('result').textContent = JSON.stringify(body, null, 2);
        } catch (err) {
          document.getElementById('result').textContent = 'Error: ' + (err.message || err);
        }
      });

      document.getElementById('clear').addEventListener('click', () => {
        document.getElementById('data').value = '';
        document.getElementById('result').textContent = '—';
      });
    </script>
  </body>
</html>
